name: Refresh water data

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated states (blank = all)"
        required: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      # Census ZIP shapes and EPA boundaries change rarely; keep them a month.
      # The SDWIS and UCMR files are always fetched fresh.
      - id: month
        run: echo "value=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore slow-changing geography
        uses: actions/cache@v4
        with:
          path: |
            pipeline/.cache/zcta.zip
            pipeline/.cache/zcta_county.txt
            pipeline/.cache/boundaries.geojsonl
          key: geography-${{ hashFiles('pipeline/tapwater/download.py') }}-${{ steps.month.outputs.value }}
      - name: Build
        env:
          STATES: ${{ inputs.states }}
        run: python pipeline/build.py ${STATES:+--states "$STATES"}
      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          # meta.json always changes (build time); only commit when real data did.
          if git diff --cached --quiet -- public/data ':!public/data/meta.json'; then
            echo "No data changes."
          else
            git commit -m "Refresh water data"
            git push
          fi
